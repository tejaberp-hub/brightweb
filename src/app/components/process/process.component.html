<section class="section process-section">
  <div class="container">
    <div class="section-header reveal">
      <span class="section-badge">OUR PROCESS</span>
      <h2 class="section-title">From Idea to Website in 4 Simple Steps</h2>
    </div>

    <div class="process-timeline reveal">
      <svg class="timeline-curve" viewBox="0 0 1000 90" preserveAspectRatio="none" aria-hidden="true">
        <path
          d="M70 45 C 220 5, 300 85, 500 45 S 780 5, 930 45"
          fill="none"
          stroke="#d1d5db"
          stroke-width="2.5"
          stroke-dasharray="6 9"
          stroke-linecap="round"
        />
      </svg>

      @for (step of steps; track step.number) {
        <div class="step-card">
          <div class="step-icon-wrapper" [style.backgroundColor]="step.iconBg">
            <span class="step-number">{{ step.number }}</span>

            @if (step.icon === 'chat') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            }
            @if (step.icon === 'pencil') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            }
            @if (step.icon === 'code') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
            }
            @if (step.icon === 'rocket') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.71.79-1.81.2-2.4-.59-.59-1.69-.51-2.4.2z"></path>
                <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
                <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
                <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
              </svg>
            }
          </div>

          <div class="step-content">
            <h3 class="step-title">{{ step.title }}</h3>
            <p class="step-desc">{{ step.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
