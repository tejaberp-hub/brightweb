<section class="benefits-section">
  <div class="container">
    <div class="benefits-grid reveal">
      @for (item of benefits; track item.title) {
        <div class="benefit-card">
          <div class="icon-wrapper" [style.backgroundColor]="item.iconBg">
            @if (item.icon) {
              <span class="rupee-symbol">{{ item.icon }}</span>
            }
            @if (item.iconType === 'mobile') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
              </svg>
            }
            @if (item.iconType === 'search') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            }
            @if (item.iconType === 'lightning') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff" stroke="none">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
            }
          </div>
          <div class="benefit-info">
            <h3 class="benefit-title">{{ item.title }}</h3>
            <p class="benefit-desc">{{ item.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
