<header class="site-header" [class.scrolled]="isScrolled">
  <div class="container header-container">
    <a href="#home" class="logo" (click)="scrollToSection('home', $event)" [attr.aria-label]="siteConfig.brandName">
      <img
        class="logo-mark"
        [src]="siteConfig.logos.mark"
        [alt]=""
        width="44"
        height="44"
        aria-hidden="true"
      />
      <span class="logo-text" aria-hidden="true">
        <span class="logo-text-accent">T-</span>BRIGHTWEB
      </span>
    </a>

    <nav class="desktop-nav" aria-label="Primary">
      <ul class="nav-list">
        @for (item of navItems; track item.id) {
          <li>
            <a
              [href]="item.link"
              class="nav-link"
              [class.active]="activeSection === item.id"
              (click)="scrollToSection(item.id, $event)">
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header-actions">
      <a href="#contact" class="btn btn-primary cta-btn" (click)="scrollToSection('contact', $event)">
        Get a Free Quote →
      </a>

      <button
        class="hamburger-btn"
        [class.open]="isMobileMenuOpen"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="mobile-drawer" [class.open]="isMobileMenuOpen">
    <div class="drawer-overlay" (click)="closeMobileMenu()"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <a href="#home" class="logo" (click)="scrollToSection('home', $event)" [attr.aria-label]="siteConfig.brandName">
          <img
            class="logo-mark"
            [src]="siteConfig.logos.mark"
            [alt]=""
            width="40"
            height="40"
            aria-hidden="true"
          />
          <span class="logo-text" aria-hidden="true">
            <span class="logo-text-accent">T-</span>BRIGHTWEB
          </span>
        </a>
        <button class="close-btn" (click)="closeMobileMenu()" aria-label="Close menu">×</button>
      </div>

      <nav class="mobile-nav" aria-label="Mobile">
        <ul>
          @for (item of navItems; track item.id) {
            <li>
              <a
                [href]="item.link"
                class="mobile-nav-link"
                [class.active]="activeSection === item.id"
                (click)="scrollToSection(item.id, $event)">
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <a href="#contact" class="btn btn-primary mobile-cta-btn" (click)="scrollToSection('contact', $event)">
        Get a Free Quote →
      </a>
    </div>
  </div>
</header>
