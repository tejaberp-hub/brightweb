<section class="final-cta-section">
  <div class="container">
    <div class="cta-banner reveal">
      <div class="cta-leaf cta-leaf-1" aria-hidden="true"></div>
      <div class="cta-leaf cta-leaf-2" aria-hidden="true"></div>

      <div class="cta-person-visual">
        <img
          src="assets/images/cta/business-owner.jpg"
          alt="Business owner ready to grow online"
        />
      </div>

      <div class="cta-content">
        <h2 class="cta-title">Ready to Take Your Business Online?</h2>
        <p class="cta-subtitle">
          Let's build a professional website that helps your business stand out.
        </p>
      </div>

      <div class="cta-action">
        <a href="#contact" class="btn btn-primary cta-button" (click)="scrollToContact($event)">
          Get Your Free Quote →
        </a>
      </div>
    </div>
  </div>
</section>
